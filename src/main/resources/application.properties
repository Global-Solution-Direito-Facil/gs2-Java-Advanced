spring.application.name=DireitoFacil
server.port=${PORT:8080}

#Banco Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000

#Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# O schema da FIAP ja tem objetos de outras aulas: o baseline na versao 0 deixa o
# Flyway aplicar V1 a V5 mesmo com o schema nao vazio (as tabelas T_DF_* nao podem existir).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# O schema Oracle da FIAP e compartilhado com outros projetos do aluno, cada um
# com o proprio historico do Flyway. Este projeto usa uma tabela de historico separada.
spring.flyway.table=FLYWAY_DIREITOFACIL_HISTORY

#JWT (HS256): mesma chave da API .NET, usada como texto UTF-8; minimo 32 caracteres.
# A chave nunca vai para o repositorio: defina JWT_SECRET no ambiente.
jwt.secret=${JWT_SECRET:}
# Issuer, audience e validade (8 horas) sao os mesmos da .NET; ela recusa token sem eles.
jwt.issuer=${JWT_ISSUER:direitofacil}
jwt.audience=${JWT_AUDIENCE:direitofacil-app}
jwt.expiracao-minutos=${JWT_EXPIRATION_MINUTES:480}

#API .NET de documentos: o Java baixa o arquivo e informa o status com um token SERVICO.
# Sem DOTNET_API_URL a aplicacao sobe; so essas chamadas ficam indisponiveis.
dotnet.api.url=${DOTNET_API_URL:}
dotnet.api.prefixo=${DOTNET_API_PREFIX:/api/v1}
dotnet.api.timeout-segundos=${DOTNET_API_TIMEOUT:30}

#Spring AI (Gemini): leitura do laudo e da receita. Sem GEMINI_API_KEY a aplicacao sobe;
# so a leitura por IA fica indisponivel. Temperatura 0: a IA transcreve, nao cria.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0
# Embeddings da base de conhecimento do RAG (src/main/resources/conhecimento), com a mesma chave.
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
direitofacil.ia.timeout-ms=${GEMINI_TIMEOUT_MS:60000}

#RabbitMQ (requisito 5, opcao A): eventos de caso publicados e consumidos pelo Java.
# Os padroes batem com o docker-compose.yml (myuser/secret).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

#Monitor de prazos: todo dia as 8h publica PrazoVencendo e CasoParado
direitofacil.monitor.cron=${MONITOR_CRON:0 0 8 * * *}
direitofacil.monitor.dias-prazo=7
direitofacil.monitor.dias-parado=15

#Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=INFO
