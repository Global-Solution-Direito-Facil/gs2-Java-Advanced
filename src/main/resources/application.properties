spring.application.name=DiretoFacil
server.port=8080

#Banco Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000

#Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# O schema da FIAP e compartilhado com o PetCareHub, que tem o proprio
# flyway_schema_history. Este projeto usa uma tabela de historico separada.
spring.flyway.table=FLYWAY_DIRETOFACIL_HISTORY

logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=INFO
